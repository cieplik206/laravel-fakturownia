name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fakturownia_testing
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fakturownia_testing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      FAKTUROWNIA_TEST_DB_ALLOW_SCHEMA: '1'
      FAKTUROWNIA_TEST_DB_DATABASE: fakturownia_testing
      FAKTUROWNIA_TEST_DB_HOST: 127.0.0.1
      FAKTUROWNIA_TEST_DB_PASSWORD: postgres
      FAKTUROWNIA_TEST_DB_PORT: '5432'
      FAKTUROWNIA_TEST_DB_SSLMODE: disable
      FAKTUROWNIA_TEST_DB_USERNAME: postgres

    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          coverage: none
          extensions: curl, json, sodium, posix
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/pint --test src tests

      - name: Run static analysis
        run: vendor/bin/phpstan analyse --no-progress

      - name: Run tests
        run: composer test

      - name: Run PostgreSQL tests without skips
        run: composer test:pgsql

      - name: Audit dependencies
        run: composer audit

  tests:
    name: Compatibility (${{ matrix.profile }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: minimum
            php: '8.4'
            command: test:compatibility:min
          - profile: locked
            php: '8.4'
            command: test:compatibility:locked
          - profile: latest
            php: '8.5'
            command: test:compatibility:latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: curl, json, sodium, posix
          tools: composer:v2

      - name: Run ${{ matrix.profile }} compatibility gate
        run: composer ${{ matrix.command }}

  passed:
    name: CI Passed
    if: always()
    needs:
      - quality
      - tests
    runs-on: ubuntu-slim
    timeout-minutes: 2

    steps:
      - name: Verify all CI jobs passed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$TESTS_RESULT" = success
